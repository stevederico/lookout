<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lookout · test app</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #0b0b0c; color: #eee; display: grid; place-items: center; min-height: 100vh; }
      main { width: min(560px, 90vw); padding: 32px; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      p.lede { color: #999; margin: 0 0 24px; }
      .card { background: #161618; border: 1px solid #262629; border-radius: 12px; padding: 20px; margin: 12px 0; }
      .card h2 { margin: 0 0 6px; font-size: 16px; }
      .card p { margin: 0; color: #aaa; font-size: 14px; }
      button { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
      .primary { background: #7c3aed; color: #fff; }
      .ghost { background: #222; color: #ccc; }
      .row { display: flex; gap: 10px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Lookout test app</h1>
      <p class="lede">Press ⌘⇧L, click any element, add a note, send it to Grok.</p>

      <div class="card">
        <h2>Pricing</h2>
        <p>Three tiers. Most people pick the middle one.</p>
      </div>

      <div class="card">
        <h2>Newsletter</h2>
        <p>One email a week. No spam.</p>
      </div>

      <div class="row">
        <button class="primary">Get started</button>
        <button class="ghost">Learn more</button>
      </div>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
